name: hol-scanner

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HOL plugin scanner (gate at 90, fail on high)
        uses: hashgraph-online/ai-plugin-scanner-action@59f2f1867207d2751c373fafbd1a9b7a4a23377f # v1
        with:
          plugin_dir: "."
          mode: scan
          min_score: 90
          fail_on_severity: high
          format: sarif
          upload_sarif: true
