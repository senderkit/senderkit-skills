interface:
  display_name: "SenderKit MCP Messaging Operations"
  short_description: "Operate SenderKit through MCP tools"
  default_prompt: "Use $senderkit-mcp-messaging-operations to send a test message and verify its status through SenderKit MCP."
dependencies:
  tools:
    - type: "mcp"
      value: "senderkit"
      description: "SenderKit MCP server — send, inspect, and cancel email/SMS/push messages and manage templates"
      transport: "streamable_http"
      url: "https://mcp.senderkit.com"
